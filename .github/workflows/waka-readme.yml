name: Update WakaTime Stats

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: wakatime-readme
  cancel-in-progress: false

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Update weekly coding activity
        uses: athul/waka-readme@master
        with:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_BRANCH: main
          TIME_RANGE: last_7_days
          LANG_COUNT: "6"
          SHOW_TIME: "true"
          SHOW_TOTAL: "true"
          SHOW_TITLE: "false"
          COMMIT_MESSAGE: "chore: update WakaTime statistics"
